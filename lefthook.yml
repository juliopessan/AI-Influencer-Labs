# Local checkpoints, kept fast. CI owns the full gate.
# Install once with: npx lefthook install

pre-commit:
  parallel: true
  jobs:
    - name: lint (staged)
      glob: '*.{ts,tsx}'
      run: npx oxlint --fix {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: '*.{ts,tsx}'
      run: npm run typecheck

    - name: whitespace
      run: git diff --cached --check

pre-push:
  jobs:
    - name: test
      run: npm test
